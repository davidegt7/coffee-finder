<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17110d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta
      name="description"
      content="Coffee Finder — encuentra comida real cerca de ti. Sin gluten, sin azúcar, sin aceites de semillas, orgánico."
    />
    <title>Coffee Finder</title>
  </head>
  <body>
    <script>
      // Set the theme before first paint. Without this a dark-mode user gets a
      // white flash on every load, which is the most obvious tell of a web page
      // pretending to be an app.
      (function () {
        try {
          var t = localStorage.getItem("coffeefinder.theme");
          if (t !== "light" && t !== "dark")
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
